input_manifest_path: data/processed/manifest_silver_anomaly.parquet

# If output_manifest_path is omitted, output is:
# data/processed/splits_anomaly/<split_id>/training_manifest.parquet
output_splits_path: data/processed/splits_anomaly
output_manifest_path: null
current_output_manifest_path: data/processed/splits_anomaly/current/training_manifest.parquet
split_versions_registry_path: data/processed/split_versions_anomaly.parquet

app_name: mri-split-anomaly
master: null

# split config
seed: 42
split_id: null
split_ratios: [0.7, 0.15, 0.15]

# spark tuning
partitions: 8
shuffle_partitions: 8

# output manifest partitioning
partition_by:
  - split
