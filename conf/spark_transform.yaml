input_manifest_path: data/processed/manifest_bronze.parquet
output_images_path: data/processed/images_silver
output_manifest_path: data/processed/manifest_silver.parquet
versions_registry_path: data/processed/transform_versions.parquet

app_name: mri-transform
master: null

# resize config
target_size: [224, 224]
resize_strategy: keep_aspect_pad
transform_version: v1

foreground_crop_enabled: true
foreground_mask_enabled: true
intensity_normalization_enabled: true
foreground_threshold: 12

# optional visual debug export (small sample only)
debug_export_enabled: true
debug_export_path: data/debug/transform_preview
debug_export_n: 100
debug_export_per_class: null
debug_export_seed: 42

# spark tuning
partitions: 8
shuffle_partitions: 8

# output manifest partitioning
partition_by:
  - pathology
  - modality
