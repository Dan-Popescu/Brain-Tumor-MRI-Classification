# CNN Autoencoder for anomaly detection – trained on normal scans only.
input_tfrecord_path: data/processed/training_tfrecord/current
seed: 42
image_size: [224, 224]
batch_size: 32
epochs: 50
learning_rate: 0.001
shuffle_buffer: 2048
latent_dim: 128

# The pathology name for normal scans in the dataset.
# Set normal_label_idx explicitly if auto-detection fails.
normal_label_name: "_NORMAL"
normal_label_idx: null

early_stopping_patience: 10

model_output_dir: models/anomaly_autoencoder
best_model_filename: best_autoencoder.keras
final_model_filename: final_autoencoder.keras
threshold_filename: anomaly_threshold.json
run_summary_filename: anomaly_train_run_summary.json