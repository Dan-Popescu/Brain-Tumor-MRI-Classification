input_manifest_path: data/processed/splits_anomaly/current/training_manifest.parquet

# If output_path is omitted, output is:
# data/processed/training_tfrecord_anomaly/<export_id>
output_root_path: data/processed/training_tfrecord_anomaly
output_path: null
current_output_path: data/processed/training_tfrecord_anomaly/current
training_tfrecord_registry_path: data/processed/training_tfrecord_versions_anomaly.parquet

app_name: mri-training-tfrecord-anomaly
master: null

# sharding config
seed: 42
n_shards: 16
export_id: null

# spark tuning
partitions: 8
shuffle_partitions: 8

# dataframe repartitioning before TFRecord write
partition_by:
  - split
  - shard_id
