input_path: data/raw
output_manifest_path: data/processed/manifest_bronze.parquet
app_name: mri-manifest-preprocess
master: null

# Optional tuning
partitions: 12           # local setting
shuffle_partitions: 16  # global setting

# Output layout
partition_by:
  - pathology
  - modality
sort_within_partitions: true

# Include directories/files that start with `_` (e.g. `_NORMAL T1`)
# while still filtering image extensions in code.
include_hidden_input_paths: true
